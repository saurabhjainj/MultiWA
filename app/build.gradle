plugins {
    id 'com.android.application'
}

android {
    namespace 'com.multiwa'
    compileSdk 34

    defaultConfig {
        applicationId "com.multiwa"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Fixed key so every new build installs as an update (logins are kept).
    signingConfigs {
        fixed {
            storeFile file('multiwa.jks')
            storePassword 'multiwa123'
            keyAlias 'multiwa'
            keyPassword 'multiwa123'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
        release { signingConfig signingConfigs.fixed }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Lets us hook WhatsApp Web's notifications before its own scripts load.
    implementation 'androidx.webkit:webkit:1.10.0'
}
